name: V3.3.3 regression
on:
  push:
    branches: [V3.3.3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v333-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve approved core and appearance files
        run: |
          git diff --exit-code 493a81c8e6a3765a2615ed1339c5b236e2d91b05 HEAD -- src/styles.css src/icons.js src/game.js src/domain.js src/authority.js src/tournament.js src/party.css src/party-ui.js
      - name: Full Node regression
        run: |
          set -o pipefail
          mkdir -p tests-output
          npm test 2>&1 | tee tests-output/node-results.txt
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Account, friends and recovery browser flows
        run: python tests/community-ui.py
      - name: Existing party browser flows
        run: python tests/party-browser.py
      - name: Existing economy browser flows
        run: python tests/economy-ui.py
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-v333-tests
          path: tests-output/
          retention-days: 7
