name: V3.3.4 ranked and notifications regression
on:
  push:
    branches: [V3.3.4]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v334-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve approved gameplay, economics and theme contracts
        run: |
          git diff --exit-code 0b9e84db768dffed8c1396e272c0b173b3d8d414 HEAD -- src/styles.css src/game.js src/authority.js src/tournament.js src/party.css src/party-ui.js
      - name: Full Node regression
        run: |
          set -o pipefail
          mkdir -p tests-output
          npm test 2>&1 | tee tests-output/v334-node-results.txt
      - name: HTTP suites terminate individually
        run: |
          set -euo pipefail
          for suite in tests/community-http.test.js tests/http.test.js tests/party-http.test.js; do
            echo "Running $suite"
            timeout --signal=KILL 45s node --test "$suite"
          done
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Account, friends, notification and challenge browser flow
        run: |
          set -o pipefail
          python tests/community-ui.py 2>&1 | tee tests-output/v334-community-ui.txt
      - name: Existing party flow
        run: |
          set -o pipefail
          python tests/party-browser.py 2>&1 | tee tests-output/v334-party-ui.txt
      - name: Existing economy and ranked flow
        run: |
          set -o pipefail
          python tests/economy-ui.py 2>&1 | tee tests-output/v334-economy-ui.txt
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-v334-verification
          path: tests-output/
          retention-days: 5
