name: Mega XO validation
on:
  push:
    branches: [V3.5, V3.5.1, V4]
    tags: ['v4.*']
  pull_request:
    branches: [V4]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[image-check]') && 'images' || 'sources' }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source checkpoint
        run: |
          mkdir -p .artifacts
          git archive --format=tar HEAD | gzip > .artifacts/v35-source.tar.gz
      - name: Full Node regression
        run: npm test 2>&1 | tee .artifacts/node-tests.log
      - name: Game design invariants
        run: npm run test:invariants 2>&1 | tee .artifacts/invariants.log
      - name: Ranked balance
        run: npm run test:balance
      - name: Population economy model
        run: npm run test:economy-sim
      - name: Monetisation sensitivity model
        run: npm run test:monetization-model
      - name: Seeded production workload
        run: npm run test:load 2>&1 | tee .artifacts/load-tests.log
      - name: Deployment shell syntax
        run: |
          bash -n deploy/release.sh deploy/install-secrets.sh deploy/configure-r2-backup.sh deploy/enable-backups.sh deploy/prepare-staging.sh scripts/image-smoke.sh scripts/vps-preflight.sh
          sh -n deploy/run.sh deploy/backup-loop.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Chromium monetisation flows
        run: npm run test:monetization-ui 2>&1 | tee .artifacts/browser-tests.log
      - name: Collect browser evidence
        if: always()
        run: |
          mkdir -p .artifacts/screenshots
          if [ -d tests-output ]; then cp tests-output/v35*.png .artifacts/screenshots/ 2>/dev/null || true; fi
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-validation
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  images:
    needs: validation
    if: startsWith(github.ref, 'refs/tags/v4.') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[image-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: mega-xo-ci:${{ matrix.arch }}
          build-args: MEGA_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=v4-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=v4-${{ matrix.arch }}
      - name: Container acceptance and encrypted restore
        shell: bash
        run: bash scripts/image-smoke.sh mega-xo-ci:${{ matrix.arch }} linux/${{ matrix.arch }}
  publish:
    needs: [validation, images]
    if: startsWith(github.ref, 'refs/tags/v4.')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/oculusrex14/mega-xo:${{ github.ref_name }},ghcr.io/oculusrex14/mega-xo:sha-${{ github.sha }}
          build-args: MEGA_RELEASE=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: |
            type=gha,scope=v4-amd64
            type=gha,scope=v4-arm64
      - name: Record immutable deployment image
        run: echo 'Deploy ghcr.io/oculusrex14/mega-xo@${{ steps.publish.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
