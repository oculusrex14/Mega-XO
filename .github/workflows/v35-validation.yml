name: Mega XO validation
on:
  push:
    branches: [V3.5, V3.5.1, V4, V4.1, V5-platform]
    tags: ['v4.*']
  pull_request:
    branches: [V4, V4.1, V5-platform]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[image-check]') && 'images' || 'sources' }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Production tag gate
        if: startsWith(github.ref, 'refs/tags/v4.')
        run: node scripts/release-gate.js
      - name: Source checkpoint
        run: |
          mkdir -p .artifacts
          git archive --format=tar HEAD | gzip > .artifacts/v4-source.tar.gz
      - name: Full Node regression
        run: |
          set -o pipefail
          npm test 2>&1 | tee .artifacts/node-tests.log
      - name: Game design invariants
        run: |
          set -o pipefail
          npm run test:invariants 2>&1 | tee .artifacts/invariants.log
      - name: Ranked balance
        run: npm run test:balance
      - name: Population economy model
        run: npm run test:economy-sim
      - name: Monetisation sensitivity model
        run: npm run test:monetization-model
      - name: Seeded production workload
        run: |
          set -o pipefail
          npm run test:load 2>&1 | tee .artifacts/load-tests.log
      - name: P1-9 abuse acceptance
        run: npm run abuse:audit
      - name: Deployment tooling syntax
        run: |
          bash -n deploy/release.sh deploy/verify-release.sh deploy/rotate-secret.sh deploy/rotate-r2-credentials.sh deploy/install-secrets.sh deploy/configure-r2-backup.sh deploy/enable-backups.sh deploy/prepare-staging.sh deploy/staging-smoke.sh deploy/audit-perimeter.sh deploy/host-health-monitor.sh deploy/db-integrity-check.sh deploy/install-monitoring.sh scripts/image-smoke.sh scripts/vps-preflight.sh
          sh -n deploy/run.sh deploy/backup-loop.sh
          node --check scripts/release-gate.js
          node --check scripts/live-email-acceptance.js
          node --check scripts/external-perimeter-probe.js
          node --check scripts/provider-web-smoke.js
          node --check scripts/init-vps.js
          node --check scripts/backup-run.js
          node --check scripts/ops.js
          node --check scripts/operator.js
          node --check scripts/capacity-acceptance.js
          node --check scripts/db-maintenance.js
          node --check scripts/db-growth-smoke.js
          node --check scripts/mail-domain-audit.js
          node --check server/competitive-abuse.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Chromium accessibility gate
        run: |
          set -o pipefail
          python3 tests/accessibility-ui.py 2>&1 | tee .artifacts/accessibility-tests.log
      - name: Chromium monetisation flows
        run: |
          set -o pipefail
          npm run test:monetization-ui 2>&1 | tee .artifacts/browser-tests.log
      - name: Collect browser evidence
        if: always()
        run: |
          mkdir -p .artifacts/screenshots
          if [ -d tests-output ]; then cp tests-output/v35*.png .artifacts/screenshots/ 2>/dev/null || true; fi
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v4-validation
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  images:
    needs: validation
    if: startsWith(github.ref, 'refs/tags/v4.') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[image-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: mega-xo-ci:${{ matrix.arch }}
          build-args: MEGA_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=v4-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=v4-${{ matrix.arch }}
      - name: Container acceptance and encrypted restore
        shell: bash
        run: bash scripts/image-smoke.sh mega-xo-ci:${{ matrix.arch }} linux/${{ matrix.arch }}
  publish:
    needs: [validation, images]
    if: startsWith(github.ref, 'refs/tags/v4.')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Reconfirm production release gate
        run: node scripts/release-gate.js
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: publish
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/oculusrex14/mega-xo:${{ github.ref_name }},ghcr.io/oculusrex14/mega-xo:sha-${{ github.sha }}
          build-args: MEGA_RELEASE=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: |
            type=gha,scope=v4-amd64
            type=gha,scope=v4-arm64
      - name: Record immutable deployment image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          docker buildx imagetools inspect "ghcr.io/oculusrex14/mega-xo@$IMAGE_DIGEST" >/dev/null
          mkdir -p .release
          node -e 'const fs=require("fs"); const value={version:process.env.GITHUB_REF_NAME,gitSha:process.env.GITHUB_SHA,image:"ghcr.io/oculusrex14/mega-xo@"+process.env.IMAGE_DIGEST,publishedAt:new Date().toISOString()}; fs.writeFileSync(".release/immutable-release.json",JSON.stringify(value,null,2)+"\\n");'
          cat .release/immutable-release.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain immutable release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.ref_name }}-immutable-release
          path: .release/immutable-release.json
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Immutable image: `ghcr.io/oculusrex14/mega-xo@%s`\n\nGit SHA: `%s`\n' "$IMAGE_DIGEST" "$GITHUB_SHA" > .release/notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Mega XO $GITHUB_REF_NAME" --notes-file .release/notes.md
