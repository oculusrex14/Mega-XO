name: Mega XO validation
on:
  push:
    branches: [V3.5, V3.5.1, V4]
    tags: ['v4.*']
  pull_request:
    branches: [V4]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source checkpoint
        run: |
          mkdir -p .artifacts
          git archive --format=tar HEAD | gzip > .artifacts/v35-source.tar.gz
      - name: Full Node regression
        run: npm test 2>&1 | tee .artifacts/node-tests.log
      - name: Game design invariants
        run: npm run test:invariants 2>&1 | tee .artifacts/invariants.log
      - name: Ranked balance
        run: npm run test:balance
      - name: Population economy model
        run: npm run test:economy-sim
      - name: Monetisation sensitivity model
        run: npm run test:monetization-model
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Chromium monetisation flows
        run: npm run test:monetization-ui 2>&1 | tee .artifacts/browser-tests.log
      - name: Collect browser evidence
        if: always()
        run: |
          mkdir -p .artifacts/screenshots
          if [ -d tests-output ]; then cp tests-output/v35*.png .artifacts/screenshots/ 2>/dev/null || true; fi
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-validation
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
