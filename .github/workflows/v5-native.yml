name: V5 native host build verification
# P20 co-development: compile unsigned debug/simulator hosts from the same
# immutable allowlisted client revision. No provider secrets, signing, uploads
# to stores, native commerce/ad SDK or production project access.
# Run once per PR (plus after integration to V5); not once on both
# co-dev branch push and its PR, which duplicates macOS build minutes.
on:
  push:
    branches: [V5-platform]
    paths:
      - 'native/**'
      - 'scripts/v5/build-client.js'
      - 'tests/v5-native-foundations.test.js'
      - 'src/**'
      - 'public/**'
      - 'assets/vendor/**'
      - 'index.html'
      - '.github/workflows/v5-native.yml'
  pull_request:
    branches: [V5-platform]
    paths:
      - 'native/**'
      - 'scripts/v5/build-client.js'
      - 'tests/v5-native-foundations.test.js'
      - 'src/**'
      - 'public/**'
      - 'assets/vendor/**'
      - 'index.html'
      - '.github/workflows/v5-native.yml'
permissions:
  contents: read
concurrency:
  group: v5-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate source and host boundaries
        run: node --test tests/v5-native-foundations.test.js tests/v5-client-bundle.test.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's historic default includes the retired "tools" package,
          # which sdkmanager refuses on current GitHub Linux runners.
          packages: platform-tools
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile signed-by-debug-key Android APK
        run: gradle -p native/android :app:assembleDebug --no-daemon --stacktrace
      - name: Assert bundled game and hash APK
        shell: bash
        run: |
          set -euo pipefail
          apk=native/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -F 'assets/mega/bundle-index.html'
          unzip -l "$apk" | grep -F 'assets/mega/client-bundle.manifest.json'
          # AAR manifests can silently re-add INTERNET/AD_ID even when our
          # app manifest omits them. Assert effective installed APK permissions.
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          if "$aapt" dump permissions "$apk" | grep -E 'android.permission.INTERNET|com.google.android.gms.permission.AD_ID'; then
            echo "Offline P20 host unexpectedly has network or advertising ID permissions" >&2
            exit 1
          fi
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mega-xo-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify project configuration
        run: |
          xcodebuild -list -project native/ios/MegaXO.xcodeproj
          plutil -lint native/ios/MegaXO/Info.plist
      - name: Compile unsigned iOS Simulator app
        run: |
          xcodebuild -project native/ios/MegaXO.xcodeproj -scheme MegaXO \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/mega-xo-ios" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Assert signed-source game assets included in built app
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/mega-xo-ios/Build/Products/Debug-iphonesimulator/MegaXO.app"
          test -s "$app/MegaClient/bundle-index.html"
          test -s "$app/MegaClient/client-bundle.manifest.json"
          test ! -e "$app/MegaClient/src/authority.js"
          shasum -a 256 "$app/MegaClient/client-bundle.manifest.json"
      - name: Boot iOS Simulator and capture offline first-launch screenshot
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/mega-xo-ios/Build/Products/Debug-iphonesimulator/MegaXO.app"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/mega-simulator-devices.json"
          udid="$(node - "$RUNNER_TEMP/mega-simulator-devices.json" <<'JS'
          const fs = require('node:fs');
          const devices = Object.values(JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).devices).flat();
          const device = devices.find(d => d.isAvailable && /^iPhone/.test(d.name));
          if (!device) process.exit(5);
          process.stdout.write(device.udid);
          JS
          )"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" online.megaxo.prototype
          sleep 6
          mkdir -p "$RUNNER_TEMP/mega-ios-smoke"
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/mega-ios-smoke/first-launch.png"
          test -s "$RUNNER_TEMP/mega-ios-smoke/first-launch.png"
          xcrun simctl shutdown "$udid"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mega-xo-ios-simulator-smoke
          path: ${{ runner.temp }}/mega-ios-smoke/
          retention-days: 7
          if-no-files-found: warn

  android-emulator-smoke:
    name: Android emulator offline first-launch
    needs: source-and-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@v4
        with:
          name: mega-xo-android-debug
          path: ${{ runner.temp }}/mega-apk
      - name: Enable KVM acceleration when available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            APK_PATH="$RUNNER_TEMP/mega-apk/app-debug.apk" SCREENSHOT_DIR="$RUNNER_TEMP/mega-android-smoke" bash scripts/v5/native-smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mega-xo-android-emulator-smoke
          path: ${{ runner.temp }}/mega-android-smoke/
          retention-days: 7
          if-no-files-found: warn
