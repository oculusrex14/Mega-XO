name: V5 P18 staging acceptance foundations
# Early P18: inventory, acceptance evidence contracts and owned disposable PostgreSQL.
# NO Vercel/Neon staging credentials, provider effects, releases or production access.
on:
  push:
    branches: [V5-platform]
  pull_request:
    branches: [V5-platform]
permissions:
  contents: read
concurrency:
  group: v5-p18-foundations-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  p18-static-contracts:
    name: P18 acceptance registry and isolation safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate P18 source and run adversarial contract tests
        run: |
          set -euo pipefail
          node --check scripts/v5/p18/staging-isolation.js
          node --check scripts/v5/p18/acceptance-registry.js
          node --check scripts/v5/p18/stage-evidence.js
          node --check scripts/v5/p18/disposable-service-journeys.js
          node --check scripts/v5/p18/cutover-state-model.js
          node --check scripts/v5/p18/visual-baseline.js
          node --check scripts/v5/p18/staging-topology.js
          node --check scripts/v5/p18/staging-public-head.js
          node --test tests/v5-p18-*.test.js
      - name: Emit nonauthoritative preparation evidence
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          node scripts/v5/p18/staging-isolation.js > .artifacts/p18-static-isolation.json
          node scripts/v5/p18/acceptance-registry.js > .artifacts/p18-acceptance-plan.json
          node scripts/v5/p18/disposable-service-journeys.js --list > .artifacts/p18-disposable-plan.json
          node scripts/v5/p18/visual-baseline.js --inspect-source > .artifacts/p18-source-freeze.json
          node - <<'NODE'
          const fs = require('node:fs');
          for(const name of ['p18-static-isolation','p18-acceptance-plan','p18-disposable-plan','p18-source-freeze']) {
            const result=JSON.parse(fs.readFileSync('.artifacts/'+name+'.json','utf8'));
            if(result.g18Accepted!==false || result.stageExecutionAuthorized===true) {
              throw Error('source-only test cannot mark live staging accepted');
            }
          }
          console.log('P18 source-only stage prerequisites validated; live staging NOT tested');
          NODE
      - name: Save sanitized source-only planning
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p18-staging-static-plan
          path: |
            .artifacts/p18-static-isolation.json
            .artifacts/p18-acceptance-plan.json
            .artifacts/p18-disposable-plan.json
            .artifacts/p18-source-freeze.json
          retention-days: 7
          if-no-files-found: error
  p18-disposable-services:
    name: P18 disposable import/economy/Redis-loss/actor journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V5_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
      V5_PG_DISPOSABLE: '1'
      V5_PG_REQUIRED: '1'
      V5_TARGET: test
      V5_MIGRATE_ALLOW_INSECURE_LOOPBACK: '1'
      REDIS_URL: redis://127.0.0.1:6379
      V5_REDIS_REQUIRED: '1'
      V5_REDIS_DISPOSABLE: '1'
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -q"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 10s
      redis:
        # Same pinned real Redis 7.4 image as V5's disposable P06 CI.
        # This isolated container never resolves production Redis.
        image: public.ecr.aws/docker/library/redis:7.4@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked PostgreSQL dependencies
        run: npm ci --ignore-scripts
      - name: Execute real V4 import, PG economic parity, Redis loss and actor journeys
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          node scripts/v5/p18/disposable-service-journeys.js --run > .artifacts/p18-disposable-services.json
          node - <<'NODE'
          const fs=require('node:fs');
          const result=JSON.parse(fs.readFileSync('.artifacts/p18-disposable-services.json','utf8'));
          if(result.g18Accepted!==false || result.liveStagingVerified!==false ||
             result.serviceEndpointClass!=='OWNED_LOOPBACK_ONLY' ||
             result.ephemeralEndpointClass!=='OWNED_LOOPBACK_ONLY') throw Error('disposable result misrepresented as G18');
          const {SUITES}=require('./scripts/v5/p18/disposable-service-journeys.js');
          if(result.suites.length!==SUITES.length ||
             result.suites.some((s,i)=>s.suiteId!==SUITES[i].id) ||
             result.suites.some(s=>s.assertionCounters.pass<1 ||
            s.assertionCounters.fail!==0 || s.assertionCounters.skipped!==0)) throw Error('SQL suite not executed cleanly');
          console.log('P18 '+result.suites.length+' real SQL-backed suites passed; integrated staging NOT tested');
          NODE
      - name: Save sanitized disposable PostgreSQL counters
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p18-disposable-service-evidence
          path: .artifacts/p18-disposable-services.json
          retention-days: 7
          if-no-files-found: error
