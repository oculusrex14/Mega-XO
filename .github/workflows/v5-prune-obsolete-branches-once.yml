name: One-time obsolete branch cleanup
on:
  push:
    branches: [V5-platform]
    paths:
      - .github/workflows/v5-prune-obsolete-branches-once.yml
permissions:
  contents: read
jobs:
  cleanup:
    if: github.repository == 'oculusrex14/Mega-XO' && github.event.head_commit.message == 'chore: prune nine merged branches (one-time)'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check merge ancestry and delete only exact allowlisted refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          if(repo !== "oculusrex14/Mega-XO" || !token || process.env.GITHUB_REF !== "refs/heads/V5-platform") throw Error("Unexpected run context");
          const entries = [["co-dev/v5-integration","fda2d181aa57c223216ad1168f975c9ab965bda1","70fde0ee6b036fdb39c289167db8c4a8dbdb667e"],["co-dev/v5-native-foundations","22d07f3488dd5fb9a21153e4442b76da7cf84f4c","70fde0ee6b036fdb39c289167db8c4a8dbdb667e"],["co-dev/v5-p15-disaster-recovery","93409ac0a3ba667971bc7c513abef244bd2ac62f","70fde0ee6b036fdb39c289167db8c4a8dbdb667e"],["co-dev/v5-p16-core-failover","d4826989e8c09fa139fa3c9ec2fcdccdfa9d339f","70fde0ee6b036fdb39c289167db8c4a8dbdb667e"],["co-dev/v5-p18-staging-acceptance","53e06af942328ed0fe283c55ead5cd0ccb6812f5","70fde0ee6b036fdb39c289167db8c4a8dbdb667e"],["co-dev/v5-p19-load-chaos","7f9e43989c10f4eb69680d484b9d86e170044fca","70fde0ee6b036fdb39c289167db8c4a8dbdb667e"],["co-dev/v5-release-engineering","ef3837c5a6414d66fc5eb03b99475b0be88e9049","70fde0ee6b036fdb39c289167db8c4a8dbdb667e"],["ops/main-ci-guard","7a67e20200e857c34f7fe3d5a7530b3948cf0e5a","66b19db3451f5eb1af824110556aa4ab6fae138a"],["review/v5-bundle-safety-20261008","6dac51ff27c8d4a6afe5bafbffa3c46e5ca24a13","70fde0ee6b036fdb39c289167db8c4a8dbdb667e"]];
          async function api(method, path) {
            const r = await fetch("https://api.github.com/repos/" + repo + path, {
              method,
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: "Bearer " + token,
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });
            if (!r.ok) throw Error(method + " " + path + " failed with HTTP " + r.status);
            return method === "DELETE" ? null : r.json();
          }
          for (const [name, sha, retained] of entries) {
            if (["main", "V4.1", "V5-platform"].includes(name)) throw Error("Protected target");
            const ref = await api("GET", "/git/ref/heads/" + name);
            if (ref.object.sha !== sha) throw Error("Branch changed, refusing: " + name);
            const cmp = await api("GET", "/compare/" + sha + "..." + retained);
            if (cmp.behind_by !== 0 || cmp.ahead_by < 1) throw Error("Not integrated, refusing: " + name);
            process.stdout.write("VERIFIED " + name + "\n");
          }
          for (const [name] of entries) {
            await api("DELETE", "/git/refs/heads/" + name);
            process.stdout.write("DELETED " + name + "\n");
          }
          process.stdout.write("COMPLETE: only nine exact verified obsolete refs removed; main, V4.1, V5-platform retained\n");
          NODE
