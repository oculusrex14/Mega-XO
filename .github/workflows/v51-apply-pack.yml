name: V5.1 reviewed optional-pack integration
on:
  push:
    branches: ['feat/v5.1-bot-ai-tutorial']
    paths: ['scripts/v51/integrate-pack.cjs', '.github/workflows/v51-apply-pack.yml']
permissions:
  contents: read
concurrency:
  group: v51-reviewed-source-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'oculusrex14/Mega-XO' && github.ref == 'refs/heads/feat/v5.1-bot-ai-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - name: Apply only preflighted client hooks and explicit checkpoint evidence
        run: |
          node scripts/v51/integrate-pack.cjs
          node scripts/v51/update-progress.cjs docs/v5.1/bot-ai/evidence/checkpoint-c4-c7.json
      - name: Full Node regression and P21/native packaging
        run: |
          set -euo pipefail
          mkdir -p .artifacts/v51
          npm test 2>&1 | tee .artifacts/v51/node-tests.log
          node --test tests/v5-client-bundle.test.js tests/v5-p21-*.test.js
          node scripts/p21/build-web.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Real HTTP tutorial, pack controls, Worker and accessibility
        run: |
          set -euo pipefail
          python3 tests/bot/tutorial-browser.py 2>&1 | tee .artifacts/v51/tutorial-browser.log
          python3 tests/bot/pack-browser.py 2>&1 | tee .artifacts/v51/pack-browser.log
          python3 tests/bot/worker-browser.py 2>&1 | tee .artifacts/v51/worker-browser.log
          python3 tests/accessibility-ui.py 2>&1 | tee .artifacts/v51/accessibility.log
      - name: Publish only validated feature-branch changes
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/v5.1-bot-ai-tutorial
          test "$(git ls-remote origin refs/heads/feat/v5.1-bot-ai-tutorial | cut -f1)" = "$EXPECTED_HEAD"
          git diff --name-only | sort > .artifacts/v51/changed-paths.txt
          printf '%s\n' index.html native/client/bundle.config.json scripts/p21/build-web.js src/app.js src/domain.js tests/v51-bot-tutorial.test.js docs/v5.1/bot-ai/IMPLEMENTATION.md docs/v5.1/bot-ai/progress.json | sort > .artifacts/v51/allowed-paths.txt
          test -z "$(comm -23 .artifacts/v51/changed-paths.txt .artifacts/v51/allowed-paths.txt)"
          git add -- index.html native/client/bundle.config.json scripts/p21/build-web.js src/app.js src/domain.js tests/v51-bot-tutorial.test.js docs/v5.1/bot-ai/IMPLEMENTATION.md docs/v5.1/bot-ai/progress.json
          if ! git diff --cached --quiet; then
            git config user.name 'Mega XOXO validation'
            git config user.email 'validation@users.noreply.github.com'
            git commit -m 'feat(bot-ai): integrate verified pack setup and isolate unverified result rewards'
            git push origin HEAD:refs/heads/feat/v5.1-bot-ai-tutorial
          fi
          git rev-parse HEAD | tee .artifacts/v51/tested-source-commit.txt
          git archive --format=tar HEAD | gzip > .artifacts/v51/source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v51-pack-integration
          path: .artifacts/v51
          retention-days: 7
          if-no-files-found: error
