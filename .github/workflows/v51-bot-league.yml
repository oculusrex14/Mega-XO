name: V5.1 measured bot league
on:
  push:
    branches: ['feat/v5.1-bot-ai-tutorial']
    paths: ['tests/bot/profiles-league.cjs', '.github/workflows/v51-bot-league.yml']
permissions:
  contents: read
concurrency:
  group: v51-strength-${{ github.ref }}
  cancel-in-progress: false
jobs:
  league:
    if: github.ref == 'refs/heads/feat/v5.1-bot-ai-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Paired original and candidate Expert at 320ms
        run: |
          set -o pipefail
          mkdir -p .artifacts/v51
          node tests/bot/candidate-league.cjs 32 320 .artifacts/v51/full-budget-league.json | tee .artifacts/v51/full-budget-summary.log
      - name: Adjacent tiers at their configured budgets
        run: |
          set -o pipefail
          node tests/bot/profiles-league.cjs 8 | tee .artifacts/v51/profiles-summary.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v51-strength-league
          path: .artifacts/v51
          if-no-files-found: error
          retention-days: 7
