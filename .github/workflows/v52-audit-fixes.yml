name: V5.2 independent audit regression
on:
  push:
    branches: ['V5.2']
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    branches: ['V5.2']
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v52-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-hotfix-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Verify APK email, mail delivery, download metrics, board and deployment regressions
        shell: bash
        run: |
          set -euo pipefail
          suites=(
            tests/v5-native-email-lane.test.js
            tests/v5-p21-native-email-ui.test.js
            tests/v51-v5-production-server.test.js
            tests/v51-deploy-production-guards.test.js
            tests/v52-mail-resend.test.js
            tests/v52-web-board-merge.test.js
            tests/v52-apk-download-tracker.test.js
          tests/v52-dodo-provider.test.js
          tests/v52-dodo-store.test.js
          )
          for suite in "${suites[@]}"; do test -f "$suite"; done
          node --test "${suites[@]}"
  audited-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd "pg_isready -U postgres -q" --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      V5_TARGET: test
      V5_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
      V5_PG_DISPOSABLE: '1'
      V5_PG_REQUIRED: '1'
      V5_MIGRATE_ALLOW_INSECURE_LOOPBACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - name: Audit unit, tutorial and neural selection
        run: |
          node --test tests/v51-audit-*.test.js tests/v51-p21-bot.test.js tests/bot/pack.test.cjs tests/bot/impossible-session.test.cjs
      - name: Signed Core integration, least privilege and PostgreSQL leaderboard privacy
        run: |
          node --test --test-concurrency=1 tests/v5-p11-core-gateway.test.js tests/v5-p12-read-cache.test.js
      - name: Dodo promo pricing, settlement boundary and unattended expiry restore (real disposable PG)
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          node --test --test-reporter=tap --test-concurrency=1 --test-force-exit tests/v52-dodo-promo.test.js 2>&1 | tee .artifacts/v52-dodo-promo.log
          grep -q '^# skipped 0$' .artifacts/v52-dodo-promo.log
