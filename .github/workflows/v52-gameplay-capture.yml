name: V5.2 gameplay capture
on:
  push:
    branches: ['V5.2']
  pull_request:
    branches: ['V5.2']
    paths:
      - 'packages/learning/**'
      - 'packages/migrations/**'
      - 'packages/services/core.js'
      - 'tests/gameplay-*'
      - 'tests/helpers/gameplay-*'
      - 'src/game.js'
      - 'src/tournament.js'
      - 'src/bot/encoding.js'
      - 'packages/db/pg/**'
      - 'scripts/gameplay-*'
      - 'docs/v5.1/data/**'
      - '.github/workflows/v52-gameplay-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gameplay-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve tracked code for independent offline validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          out = pathlib.Path('.artifacts/gameplay-source')
          out.mkdir(parents=True, exist_ok=True)
          def git(*args): return subprocess.check_output(['git', *args])
          head = git('rev-parse', 'HEAD').decode().strip()
          suffixes = {'.md', '.json', '.js', '.cjs', '.mjs', '.ts', '.tsx', '.py', '.yml', '.yaml', '.sql', '.html', '.css', '.kt', '.swift', '.xml', '.gradle', '.kts', '.sh', '.toml', '.txt', '.properties'}
          entries = []
          with zipfile.ZipFile(out / 'tracked-source.zip', 'w', zipfile.ZIP_DEFLATED) as bundle:
              for record in git('ls-tree', '-rz', '--full-tree', 'HEAD').split(b'\0'):
                  if not record: continue
                  meta, raw_path = record.split(b'\t', 1)
                  mode, kind, oid = meta.decode().split()
                  path = raw_path.decode()
                  p = pathlib.PurePosixPath(path)
                  if kind != 'blob' or mode not in ('100644', '100755'): continue
                  if p.suffix not in suffixes or any(part.startswith('.env') for part in p.parts): continue
                  data = git('cat-file', 'blob', oid)
                  if len(data) > 2097152 or b'\0' in data: continue
                  try: data.decode('utf-8')
                  except UnicodeDecodeError: continue
                  bundle.writestr(path, data)
                  entries.append({'path': path, 'blob': oid, 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)})
          (out / 'source-manifest.json').write_text(json.dumps({'sourceSha': head, 'scope': 'TRACKED_SOURCE_NOT_PLAYER_DATA', 'files': entries}, indent=2) + '\n')
          print(json.dumps({'sourceSha': head, 'files': len(entries)}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gameplay-source-${{ github.sha }}
          path: .artifacts/gameplay-source
          retention-days: 7
          if-no-files-found: error

  capture-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd "pg_isready -U postgres -q" --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      V5_TARGET: test
      V5_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
      V5_PG_DISPOSABLE: '1'
      V5_PG_REQUIRED: '1'
      V5_MIGRATE_ALLOW_INSECURE_LOOPBACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - name: Run synthetic canonical and real disposable PostgreSQL acceptance
        env:
          CAPTURE_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/gameplay-tests
          node scripts/v5/migrate.js --dry-run --json > .artifacts/gameplay-tests/migration.json
          node --test --test-reporter=tap --test-concurrency=1 tests/gameplay-*.test.js 2>&1 | tee .artifacts/gameplay-tests/tests.tap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gameplay-tests-${{ github.sha }}
          path: .artifacts/gameplay-tests
          retention-days: 7
          if-no-files-found: error
