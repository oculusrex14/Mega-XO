name: V5.2 independent readiness evidence
on:
  push:
    branches: ['V5.2']
    paths:
      - '.github/workflows/v52-webui-readiness-audit.yml'
      - 'scripts/v51-readiness-*'
      - 'tests/v51-readiness-*'
      - 'training/bot/**'
      - 'src/bot/**'
      - 'docs/v5/progress.json'
      - 'docs/v5.1/bot-ai/progress.json'
      - 'docs/v5.1/release/OPEN-WORK-AND-OWNERS.md'
      - 'docs/p21-web/MASTER-CHECKLIST.md'
      - 'Mega-XO-V5-Implementation-Pack/**'
  pull_request:
    branches: ['V5.2']
    paths:
      - '.github/workflows/v52-webui-readiness-audit.yml'
      - 'scripts/v51-readiness-*'
      - 'tests/v51-readiness-*'
      - 'training/bot/**'
      - 'src/bot/**'
      - 'docs/v5/progress.json'
      - 'docs/v5.1/bot-ai/progress.json'
      - 'docs/v5.1/release/OPEN-WORK-AND-OWNERS.md'
      - 'docs/p21-web/MASTER-CHECKLIST.md'
      - 'Mega-XO-V5-Implementation-Pack/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: v52-readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 30
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve tracked text source and measured provenance only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          out = pathlib.Path('.artifacts/v52-readiness')
          out.mkdir(parents=True, exist_ok=True)
          def git(*args):
              return subprocess.check_output(['git', *args])
          head = git('rev-parse', 'HEAD').decode().strip()
          suffixes = {'.md', '.json', '.js', '.cjs', '.mjs', '.ts', '.tsx', '.jsx', '.py', '.yml', '.yaml', '.sql', '.html', '.css', '.kt', '.swift', '.xml', '.gradle', '.kts', '.sh', '.toml', '.txt', '.properties'}
          entries = []
          with zipfile.ZipFile(out / 'tracked-source.zip', 'w', zipfile.ZIP_DEFLATED) as bundle:
              for record in git('ls-tree', '-rz', '--full-tree', 'HEAD').split(b'\0'):
                  if not record:
                      continue
                  meta, raw_path = record.split(b'\t', 1)
                  mode, kind, oid = meta.decode().split()
                  path = raw_path.decode()
                  p = pathlib.PurePosixPath(path)
                  if kind != 'blob' or mode not in ('100644', '100755'):
                      continue
                  if p.suffix not in suffixes or any(part.startswith('.env') for part in p.parts):
                      continue
                  data = git('cat-file', 'blob', oid)
                  if len(data) > 2 * 1024 * 1024 or b'\0' in data:
                      continue
                  try:
                      data.decode('utf-8')
                  except UnicodeDecodeError:
                      continue
                  bundle.writestr(path, data)
                  entries.append({'path': path, 'blob': oid, 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)})
          manifest = {'schemaVersion': 1, 'sourceSha': head, 'scope': 'TRACKED_TEXT_ONLY_NOT_A_RELEASE_BUNDLE', 'files': entries}
          (out / 'source-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (out / 'recent-commits.txt').write_bytes(git('log', '-30', '--format=%H %s'))
          print(json.dumps({'sourceSha': head, 'trackedTextFiles': len(entries), 'sourceArchiveSha256': hashlib.sha256((out / 'tracked-source.zip').read_bytes()).hexdigest()}))
          PY
      - name: Independent tooling regressions and full source inventory
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/v51-readiness-*.test.py; do
            python3 "$test" 2>&1 | tee -a .artifacts/v52-readiness/tooling-tests.log
          done
          python3 scripts/v51-readiness-audit.py --output .artifacts/v52-readiness/inventory.json
      - name: Read current CI, PR and retained-branch metadata
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          out = pathlib.Path('.artifacts/v52-readiness')
          out.mkdir(parents=True, exist_ok=True)
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPOSITORY'] + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          runs = get('/actions/runs?branch=V5.1&per_page=100')['workflow_runs']
          runs = [{key: run.get(key) for key in ('id', 'name', 'path', 'head_sha', 'event', 'status', 'conclusion', 'created_at', 'run_attempt', 'html_url')} for run in runs]
          branches = {name: get('/git/ref/heads/' + name)['object']['sha'] for name in ('V5.2', 'V4.1')}
          prs = [{key: pr.get(key) for key in ('number', 'title', 'state', 'html_url')} for pr in get('/pulls?state=open&per_page=100')]
          report = {'branches': branches, 'openPullRequests': prs, 'runs': runs, 'scope': 'OBSERVED_CI_METADATA_NOT_RELEASE_ACCEPTANCE'}
          (out / 'github-observation.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps({'branches': branches, 'openPullRequests': prs}))
          seen = set()
          for run in runs:
              if run['path'] not in seen:
                  print(json.dumps(run))
                  seen.add(run['path'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v52-readiness-source-${{ github.sha }}
          path: .artifacts/v52-readiness
          retention-days: 7
          if-no-files-found: error
  independent-model-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail on unsafe promotion, lease races, tampered resume or broken neural feedback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/v52-readiness-probes
          python3 scripts/v51-readiness-probes.py --output .artifacts/v52-readiness-probes/results.json 2>&1 | tee .artifacts/v52-readiness-probes/probes.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v52-readiness-negative-contracts-${{ github.sha }}
          path: .artifacts/v52-readiness-probes
          retention-days: 7
          if-no-files-found: error
