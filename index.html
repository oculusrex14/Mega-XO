<!doctype html>
<html lang="en" data-theme="vector">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="author" content="Antimatter Innovations"><meta name="application-name" content="Mega XO">
<meta name="theme-color" content="#f7f9fc"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315181c'/%3E%3Cg stroke='%23c6ff42' stroke-width='4'%3E%3Cpath d='M22 10v44M42 10v44M10 22h44M10 42h44'/%3E%3C/g%3E%3C/svg%3E"><title>Mega XO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@600;700&family=Patrick+Hand&family=Orbitron:wght@600;800&family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="src/styles.css">
<link rel="stylesheet" href="src/party.css">
<link rel="stylesheet" href="src/community.css">
<link rel="stylesheet" href="src/monetization.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter></svg>
<div class="app" id="app">
<header class="topbar"><button class="brand" data-action="nav" data-value="play" aria-label="Mega XO home"><span id="brandIcon"></span><b>MEGA XO</b></button><div class="header-actions"><button class="wallet-pill" data-action="wallet" aria-label="Open wallet"><span id="coinIcon"></span><b id="walletAmount">100</b></button><button class="icon-button notification-button" id="notificationButton" data-c="notifications" aria-label="Notifications"><span class="notification-badge" id="notificationBadge" hidden>0</span></button><button class="icon-button" id="settingsButton" data-action="settings" aria-label="Settings"></button></div></header>
<div id="contentScroll" class="content-scroll">
<aside id="networkStatus" class="network-status" role="status" aria-live="polite" hidden><div class="network-status-copy"><strong id="networkStatusTitle">Connection interrupted</strong><span id="networkStatusText">Online features will reconnect automatically.</span></div><button class="button quiet network-status-action" data-action="retrynetwork" id="networkStatusAction">Try again</button></aside>
<main id="page" tabindex="-1"></main>
</div>
<section id="gameScreen" class="game-screen" hidden aria-label="Match">
<div class="match-top"><button class="icon-button" data-action="leave" aria-label="Leave match" id="backIcon"></button><div><b id="matchMode">Vs Bot</b><small id="matchLevel">Medium</small></div><span class="timer" id="clock">∞</span><button class="icon-button" data-action="settings" aria-label="Match settings" id="matchSettings"></button></div>
<div class="players"><div class="player" id="playerX"><span class="player-glyph x">X</span><div><b id="playerXName">You</b><small>Mini Boards</small></div><strong id="miniX">0</strong></div><div class="player" id="playerO"><span class="player-glyph o">O</span><div><b id="playerOName">Bot</b><small>Mini Boards</small></div><strong id="miniO">0</strong></div></div>
<div class="turn-hud" role="status" aria-live="polite"><span class="turn-icon" id="routeIcon"></span><div><b id="turnText">FREE ROUTE</b><span id="destinationText">CHOOSE ANY OPEN MINI BOARD</span></div></div>
<div class="board-wrap" id="boardWrap"><div id="board" class="mega-board" aria-label="Nine Mini Boards"></div><svg id="routeOverlay" class="route-overlay" aria-hidden="true"></svg></div>
<p class="board-note" id="previewText">Your cell decides where the next player goes.</p>
<div class="match-controls"><button class="button quiet" data-action="tutorial"><span class="match-control-icon" id="rulesIcon"></span>Rules</button><button class="button quiet danger-text" data-action="restart"><span class="match-control-icon" id="restartIcon"></span>Restart</button><button class="button quiet" data-action="matchstats"><span class="match-control-icon" id="statsIcon"></span>Stats</button></div>
</section>
<nav class="bottom-nav" id="navigation" aria-label="Main navigation"></nav>
<div class="sheet-backdrop" id="sheetBackdrop" data-action="close" hidden></div>
<section id="sheet" class="bottom-sheet" aria-labelledby="sheetTitle" role="dialog" aria-modal="true" hidden><div class="grabber"></div><div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-button" data-action="close" id="sheetClose" aria-label="Close dialog"></button></div><div id="sheetBody"></div></section>
<div id="toast" class="toast" role="status"></div>
</div>
<script src="src/game.js"></script><script src="src/domain.js"></script><script src="src/monetization.js"></script><script src="src/lan-icons.js"></script><script src="src/icons.js"></script><script src="src/account-client.js"></script><script src="src/network.js"></script><script src="src/app.js"></script><script src="src/tournament.js"></script><script src="src/party-ui.js"></script><script src="src/community.js"></script><script src="src/monetization-ui.js"></script>
</body></html>
